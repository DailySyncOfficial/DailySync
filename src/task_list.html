<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  .navbar {
            background-color: #f7f7f7;
            padding: 10px;
            box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.1);
            position: fixed;
            width: 100%;
            /* Full width */
            top: 0;
            left: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo-space {
            display: flex;
            align-items: center;
            padding-left: 20px;
        }

        .logo-space img {
            height: 40px;
        }

        .search-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
        }

        .search-container input {
            width: 50%;
            max-width: 400px;
        }

        .nav-buttons {
            display: flex;
            align-items: center;
            gap: 15px;
            padding-right: 20px;
        }

        .nav-button {
            background: #ff5e5e;
            color: white;
            border: none;
            padding: 8px 10px;
            border-radius: 10px;
            cursor: pointer;
        }

        .nav-button:hover {
            background: #ff3b3b;
        }

        .date-info {
            text-align: right;
            font-size: 14px;
        }  
</style>
</head>
<body>
    <nav class="navbar navbar-light">
        <div class="logo-space">

            <span style="font-size: 22px; font-weight: bold; color: #ff5e5e;">Daily</span>
            <span style="font-size: 22px; font-weight: bold;">Sync</span>
        </div>
        <div class="search-container">
            <input class="form-control" type="search" placeholder="Search your task here..." aria-label="Search">
        </div>
        <div class="nav-buttons">
            <button class="nav-button">🔍</button>
            <button class="nav-button">📈</button>
            <button class="nav-button">📅</button>
            <button class="nav-button">❓</button>
            <div class="date-info">
                <strong id="current-day"></strong><br>
                <span id="current-date"></span>
            </div>

        </div>
    </nav>
    <br>
    <br>
    <div class="container mt-5">
        <h2>Task List</h2>
        <table class="table">
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Description</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td style="color:skyblue;"><strong>Task</strong> </td>
                    <td>This is a sample task</td>
                    <td>
                        <a href="edit_task.html" class="btn btn-warning btn-sm">Edit</a>
                        <button class="btn btn-danger btn-sm">Delete</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <script>
        function updateDate() {
            const dateElement = document.getElementById("current-date");
            const dayElement = document.getElementById("current-day");

            const now = new Date();
            const options = { weekday: 'long' }; // Get full day name
            const formattedDay = new Intl.DateTimeFormat('en-US', options).format(now);
            const formattedDate = now.toLocaleDateString('en-GB'); // Format as DD/MM/YYYY

            dayElement.innerText = formattedDay;
            dateElement.innerText = formattedDate;
        }

        // Run function when page loads
        window.onload = updateDate;
    </script>
</body>
</html>
