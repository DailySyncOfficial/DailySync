<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.9.0/js/bootstrap-datepicker.min.js"></script>
    <style>
        .navbar {
            background-color: #f7f7f7;
            padding: 10px;
            box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.1);
            position: fixed;
            width: 100%;
            /* Full width */
            top: 0;
            left: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo-space {
            display: flex;
            align-items: center;
            padding-left: 20px;
        }

        .logo-space img {
            height: 40px;
        }

        .search-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
        }

        .search-container input {
            width: 50%;
            max-width: 400px;
        }

        .nav-buttons {
            display: flex;
            align-items: center;
            gap: 15px;
            padding-right: 20px;
        }

        .nav-button {
            background: #ff5e5e;
            color: white;
            border: none;
            padding: 8px 10px;
            border-radius: 10px;
            cursor: pointer;
        }

        .nav-button:hover {
            background: #ff3b3b;
        }

        .date-info {
            text-align: right;
            font-size: 14px;
        }

        .datepicker-dropdown {
            position: absolute !important;
            left: auto !important;
            right: 0 !important;
            /* Aligns with the right edge of the button */
            transform: translateX(-10px) translateY(5px);
            /* Fine-tune positioning */
        }


        /* Header of the datepicker (Month & Year) */
        .datepicker th {
            background: #ff5e5e;
            color: white;
            font-weight: bold;
            padding: 8px;
            border-radius: 12px 12px 0 0;
        }

        /* Days in the calendar */
        .datepicker td,
        .datepicker th {
            text-align: center;
            font-size: 14px;
            padding: 10px;
            border-radius: 8px;
        }

        /* Highlight today's date */
        .datepicker .today {
            background: #ff5e5e !important;
            color: white !important;
            font-weight: bold;
            border-radius: 8px;
        }

        /* Highlight selected date */
        .datepicker .active {
            background: #ff3b3b !important;
            color: white !important;
            font-weight: bold;
            border-radius: 8px;
        }

        /* Hover effect on calendar dates */
        .datepicker td:hover {
            background: rgba(255, 94, 94, 0.3);
            border-radius: 8px;
            cursor: pointer;
        }

        /* Make navigation arrows look better */
        .datepicker .prev,
        .datepicker .next {
            color: white !important;
            font-size: 18px;
            font-weight: bold;
        }

        /* Make the weekend dates stand out */
        .datepicker .dow:nth-child(7),
        .datepicker .dow:nth-child(1) {
            color: #ff3b3b;
            font-weight: bold;
        }

        .datepicker-wrapper {
            position: relative;
            display: inline-block;
        }

        .sidebar {
            width: 250px;
            background-color: #ff6767;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            padding-top: 20px;
            color: white;
        }

        .sidebar a {
            color: white;
            text-decoration: none;
            display: block;
            padding: 10px 20px;
        }

        .sidebar a:hover {
            background-color: #ff3b3b;
        }

        .profile-img {
            margin-top: 100px;
            width: 100px;
            /* Adjust as needed */
            height: 100px;
            /* Keep it square */
            border-radius: 50%;
            /* Make it circular */
            object-fit: cover;
            /* Prevent stretching */
            display: block;
            /* Ensure it doesn’t overlap */
            margin: 10px auto;
            /* Center it properly */
            margin-top: 45px;
            border: 3px solid white;
        }

        .logout {
            margin-bottom: 10px;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-light">
        <div class="logo-space">

            <span style="font-size: 22px; font-weight: bold; color: #ff5e5e;">Daily</span>
            <span style="font-size: 22px; font-weight: bold;">Sync</span>
        </div>
        <div class="search-container">
            <input class="form-control" type="search" placeholder="Search your task here..." aria-label="Search">
        </div>
        <div class="nav-buttons">
            <button class="nav-button">🪙</button>
            <button class="nav-button" id="dateIcon">📅</button>


            <!-- Hidden Date Input for Datepicker -->
            <input type="text" id="hiddenDateInput" style="display: none;">
            <button class="nav-button">❓</button>
            <div class="date-info">
                <strong id="current-day"></strong><br>
                <span id="current-date"></span>
            </div>

        </div>
    </nav>
    <div class="sidebar">
        <div class="text-center">
            <img src="images.jpg" alt="User Profile" class="profile-img">

            <h4>Asta</h4>
            <p>asta12@gmail.com</p>
        </div>
        <a href="Dashboard.html"><i class="fas fa-home"></i> Dashboard</a>
        <a href="task_list.html"><i class="fas fa-tasks"></i> My Task</a>
        <a href="task-cat.html"><i class="fas fa-layer-group"></i> Task Categories</a>
        <a href="DailyCoins.html"><i class="fas fa-coins"></i> Daily Coins</a>
        <a href="settings.html">
            <i class="fas fa-cog"></i> Settings
        </a>


        <a href="#" data-bs-toggle="modal" data-bs-target="#helpModal">
            <i class="fas fa-question-circle"></i> Help
        </a>
        <br>
        <br><br><br><br><br><br>
        <a href="#"><i class="fas fa-sign-out-alt"></i> Logout</a>
    </div>
    <br>
    <br>
    <div class="container mt-5">
        <h2>Task List</h2>
        <table class="table">
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Description</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td style="color:skyblue;"><strong>Task</strong> </td>
                    <td>This is a sample task</td>
                    <td>
                        <a href="edit_task.html" class="btn btn-warning btn-sm">Edit</a>
                        <button class="btn btn-danger btn-sm">Delete</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <script>
        function updateDate() {
            const dateElement = document.getElementById("current-date");
            const dayElement = document.getElementById("current-day");

            const now = new Date();
            const options = { weekday: 'long' }; // Get full day name
            const formattedDay = new Intl.DateTimeFormat('en-US', options).format(now);
            const formattedDate = now.toLocaleDateString('en-GB'); // Format as DD/MM/YYYY

            dayElement.innerText = formattedDay;
            dateElement.innerText = formattedDate;
        }

        // Run function when page loads
        window.onload = updateDate;
    </script>
    <script>
        $(document).ready(function () {
            $('#hiddenDateInput').datepicker({
                format: "dd-mm-yyyy",
                autoclose: true,
                todayHighlight: true
            }).on('show', function () {
                $('.datepicker-dropdown').css({
                    position: 'absolute',
                    top: $("#dateIcon").offset().top + $("#dateIcon").outerHeight(),
                    left: $("#dateIcon").offset().left,
                    zIndex: 9999
                });
            });

            $("#dateIcon").click(function () {
                $('#hiddenDateInput').datepicker("show");
            });
        });



    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
