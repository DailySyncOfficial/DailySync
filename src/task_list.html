    <div class="container mt-5">
        <h2>Task List</h2>
        <table class="table">
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Description</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>

                    <td style="color:skyblue;"><strong>Task</strong> </td>
                    <td>This is a sample task</td>
                    <td>
                        <a href="edit_task.html" class="btn btn-warning btn-sm">Edit</a>
                        <button class="btn btn-danger btn-sm">Delete</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <script>
        function updateDate() {
            const dateElement = document.getElementById("current-date");
            const dayElement = document.getElementById("current-day");

            const now = new Date();
            const options = { weekday: 'long' }; // Get full day name
            const formattedDay = new Intl.DateTimeFormat('en-US', options).format(now);
            const formattedDate = now.toLocaleDateString('en-GB'); // Format as DD/MM/YYYY

            dayElement.innerText = formattedDay;
            dateElement.innerText = formattedDate;
        }

        // Run function when page loads
        window.onload = updateDate;
    </script>
    <script>
        $(document).ready(function () {
            $('#hiddenDateInput').datepicker({
                format: "dd-mm-yyyy",
                autoclose: true,
                todayHighlight: true
            }).on('show', function () {
                $('.datepicker-dropdown').css({
                    position: 'absolute',
                    top: $("#dateIcon").offset().top + $("#dateIcon").outerHeight(),
                    left: $("#dateIcon").offset().left,
                    zIndex: 9999
                });
            });

            $("#dateIcon").click(function () {
                $('#hiddenDateInput').datepicker("show");
            });
        });



    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
