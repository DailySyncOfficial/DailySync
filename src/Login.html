<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Routine - Sign In</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style type="text/tailwindcss">
        :root {
            --primary-color: #0c7ff2;
            --background-color: #f8fafc;--card-background: #ffffff;
            --text-primary: #1e293b;--text-secondary: #64748b;--input-border: #cbd5e1;--input-focus-border: #0c7ff2;
        }
        body {
            font-family: 'Inter', sans-serif;
        }
        .dark-mode{

            --primary-color: #3b82f6;
            --accent-color: #4682B4;
            --background-color: #0f172a;
            --card-background: #1e1e3f;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --input-border: #4a4a6a;
            --input-focus-border: #8A2BE2;
        }
        .gradient-button {
            background-image: linear-gradient(to right, #1e90ff, #0c7ff2);
        }
    </style>
</head>
<body class="bg-[var(--background-color)] flex items-center justify-center min-h-screen" >
<div class="w-full max-w-md p-8 space-y-8 bg-[var(--card-background)] rounded-2xl shadow-lg">
    
    

<div class="text-center" >
    
<div class="flex items-center justify-center gap-2 mb-4">

<h1 class="text-3xl font-bold text-[var(--text-primary)]" >DailySync</h1>
</div>
<h2 class="text-xl font-semibold text-[var(--text-primary)]">Welcome back</h2>
<p class="text-[var(--text-secondary)] mt-2">Sign in to continue to your dashboard.</p>
</div>
<form class="space-y-6">
<div>
<label class="block text-sm font-medium text-[var(--text-primary)]" for="email">Email Address</label>
<div class="mt-1">
<input autocomplete="email" class="form-input block w-full rounded-lg border-[var(--input-border)] bg-transparent py-3 px-4 text-[var(--text-primary)] placeholder:text-gray-400 focus:border-[var(--input-focus-border)] focus:ring-2 focus:ring-[var(--input-focus-border)]/20 sm:text-sm sm:leading-6 transition-colors duration-200" id="email" name="email" placeholder="you@example.com" required="" type="email"/>
</div>
</div>
<div>
<label class="block text-sm font-medium text-[var(--text-primary)]" for="password">Password</label>
<div class="mt-1">
<input autocomplete="current-password" class="form-input block w-full rounded-lg border-[var(--input-border)] bg-transparent py-3 px-4 text-[var(--text-primary)] placeholder:text-gray-400 focus:border-[var(--input-focus-border)] focus:ring-2 focus:ring-[var(--input-focus-border)]/20 sm:text-sm sm:leading-6 transition-colors duration-200" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<div class="flex items-center justify-between">
<div class="flex items-center">
<label class="relative inline-flex items-center cursor-pointer">
<input class="sr-only peer" type="checkbox" value=""/>
<div class="w-11 h-6 bg-gray-500 rounded-full peer peer-focus:ring-2 peer-focus:ring-[var(--primary-color)]/50 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-0.5 after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-[var(--primary-color)]"></div>
<span class="ml-3 text-sm font-medium text-[var(--text-primary)]">Remember me</span>
</label>
</div>
<div class="text-sm">
<a class="font-medium text-[var(--primary-color)] hover:text-blue-500 transition-colors duration-200" href="#">Forgot your password?</a>
</div>
</div>
<div>
<button class="gradient-button flex w-full justify-center rounded-lg py-3 px-4 text-sm font-semibold text-white shadow-sm hover:opacity-90 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[var(--primary-color)] transition-opacity duration-200" type="submit">
                    Sign in
                </button>
</div>
</form>
<p class="mt-10 text-center text-sm text-[var(--text-secondary)]">
            Don’t have an account?
            <a class="font-semibold leading-6 text-[var(--primary-color)] hover:text-blue-500 transition-colors duration-200" href="#">Sign up</a>
</p>
</div>
<script>
  const toggleBtn = document.getElementById("themeToggle");
  const body = document.body;

  // Load saved preference
  if (localStorage.getItem("theme") === "dark") {
    body.classList.add("dark-mode");
  }

  toggleBtn.addEventListener("click", () => {
    body.classList.toggle("dark-mode");
    localStorage.setItem("theme", body.classList.contains("dark-mode") ? "dark" : "light");
  });
  </script>
</body></html>
