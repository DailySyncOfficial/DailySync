<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: url('istockphoto-1136816260-612x612.jpg') no-repeat center center fixed;
            background-size: cover;
        }
        .login-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            padding: 40px;
        }
        .form-control {
            border-radius: 10px;
        }
        .btn-login {
            background-color: #ff6666;
            color: white;
            border-radius: 10px;
        }
        .social-icons img {
            width: 35px;
            margin: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="row w-75 login-container">
            <div class="col-md-6">
                <h2 class="mb-4">Sign In</h2>
                <form>
                    <div class="mb-3">
                        <input type="text" class="form-control" placeholder="Enter Username">
                    </div>
                    <div class="mb-3">
                        <input type="password" class="form-control" placeholder="Enter Password">
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="rememberMe">
                        <label class="form-check-label" for="rememberMe">Remember Me</label>
                    </div>
                    <button type="submit" class="btn btn-login w-100 mt-3">Login</button>
                </form>
                <p class="mt-3">Or, Login with</p>
                <div class="social-icons">
                    <img src="facebook.png" alt="Facebook">
                    <img src="google.png" alt="Google" height="25px" width="25px">
                    <img src="X.avif" alt="X">
                </div>
                <p class="mt-3">Don't have an account? <a href="SignUp.html">Create One</a></p>
            </div>
            <div class="col-md-6 d-flex align-items-center justify-content-center">
                <div class="image-placeholder w-100" style="height: 300px; background: lightgray; border-radius: 10px;">
                    <img src="character2.png" height="350px" width="425px">
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
