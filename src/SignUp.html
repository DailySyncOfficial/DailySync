<html><head>
<meta charset="utf-8"/>
<link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect"/>
<link as="style" href="https://fonts.googleapis.com/css2?display=swap&amp;family=Inter%3Awght%40400%3B500%3B600%3B700&amp;family=Noto+Sans%3Awght%40400%3B500%3B700%3B900" onload="this.rel='stylesheet'" rel="stylesheet"/>
<title>Routine Sign Up</title>
<link href="data:image/x-icon;base64," rel="icon" type="image/x-icon"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style type="text/tailwindcss">
        :root {
            --brand-primary: #0c7ff2;
            --brand-secondary: #e7edf4;
            --text-primary: #18181b;
            --text-secondary: #71717a;
            --background-primary: #ffffff;
            --background-secondary: #f4f4f5;
        }
        body {
            font-family: 'Inter', 'Noto Sans', sans-serif;
        }
        .dark-mode {
            --brand-primary: #3b82f6;
            --brand-secondary: #8A2BE2;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --background-primary: #0f172a;
            --background-secondary: #1e1e3f;

        }
    </style>
</head>
<body class="bg-[var(--background-primary)]">
<div class="relative flex size-full min-h-screen flex-col group/design-root overflow-x-hidden">
<div class="layout-container flex h-full grow flex-col">
<header class="flex items-center justify-between whitespace-nowrap border-b border-solid border-[var(--background-secondary)] px-10 py-4">
<div class="flex items-center gap-3 text-[var(--text-primary)]">
<div class="size-6 text-[var(--brand-primary)]">
<svg > insert logo SVG here 
</svg>
</div>
<h1 class="text-3xl font-bold tracking-tight">DailySync</h1>
</div>
<div class="flex flex-1 justify-end gap-4">
<div class="hidden items-center gap-6 md:flex">

</div>
<a class="flex min-w-[84px] cursor-pointer items-center justify-center overflow-hidden rounded-md h-10 px-4 bg-[var(--background-secondary)] text-sm font-semibold text-[var(--text-primary)] transition-colors hover:bg-zinc-200" href="Login.html">
                        Log in
                    </a>
</div>
</header>
<main class="flex flex-1 justify-center py-16 sm:py-24" ">
<div class="w-full max-w-md px-4">
<div class="text-center">
<h2 class="text-3xl font-bold tracking-tighter text-[var(--text-primary)] sm:text-4xl">Create your account</h2>
<p class="mt-2 text-[var(--text-secondary)]">Start managing your daily routines for free.</p>
</div>
<form class="mt-8 space-y-6">
<div class="space-y-4">
<div>
<label class="sr-only" for="name">Name</label>
<input autocomplete="name" class="form-input block w-full appearance-none rounded-md border border-zinc-200 bg-transparent px-4 py-3 text-[var(--text-primary)] placeholder-[var(--text-secondary)] shadow-sm transition-colors focus:border-[var(--brand-primary)] focus:outline-none focus:ring-1 focus:ring-[var(--brand-primary)]" id="name" name="name" placeholder="Name" required="" type="text"/>
</div>
<div>
<label class="sr-only" for="email">Email address</label>
<input autocomplete="email" class="form-input block w-full appearance-none rounded-md border border-zinc-200 bg-transparent px-4 py-3 text-[var(--text-primary)] placeholder-[var(--text-secondary)] shadow-sm transition-colors focus:border-[var(--brand-primary)] focus:outline-none focus:ring-1 focus:ring-[var(--brand-primary)]" id="email" name="email" placeholder="Email" required="" type="email"/>
</div>
<div>
<label class="sr-only" for="password">Password</label>
<input autocomplete="new-password" class="form-input block w-full appearance-none rounded-md border border-zinc-200 bg-transparent px-4 py-3 text-[var(--text-primary)] placeholder-[var(--text-secondary)] shadow-sm transition-colors focus:border-[var(--brand-primary)] focus:outline-none focus:ring-1 focus:ring-[var(--brand-primary)]" id="password" name="password" placeholder="Password" required="" type="password"/>
</div>
<div>
<label class="sr-only" for="confirm-password">Confirm Password</label>
<input autocomplete="new-password" class="form-input block w-full appearance-none rounded-md border border-zinc-200 bg-transparent px-4 py-3 text-[var(--text-primary)] placeholder-[var(--text-secondary)] shadow-sm transition-colors focus:border-[var(--brand-primary)] focus:outline-none focus:ring-1 focus:ring-[var(--brand-primary)]" id="confirm-password" name="confirm-password" placeholder="Confirm Password" required="" type="password"/>
</div>
</div>
<div>
<button class="flex w-full justify-center rounded-md border border-transparent bg-[var(--brand-primary)] py-3 px-4 text-sm font-semibold text-white shadow-sm transition-colors hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-[var(--brand-primary)] focus:ring-offset-2" type="submit">
                                Sign up
                            </button>
</div>
</form>
<p class="mt-6 text-center text-sm text-[var(--text-secondary)]">
                        Already have an account?
                        <a class="font-medium text-[var(--brand-primary)] hover:underline" href="#">
                            Log in
                        </a>
</p>
</div>
</main>
</div>
</div>
<script>
  const toggleBtn = document.getElementById("themeToggle");
  const body = document.body;

  // Load saved preference
  if (localStorage.getItem("theme") === "dark") {
    body.classList.add("dark-mode");
  }

  toggleBtn.addEventListener("click", () => {
    body.classList.toggle("dark-mode");
    localStorage.setItem("theme", body.classList.contains("dark-mode") ? "dark" : "light");
  });
  </script>
</body></html>
