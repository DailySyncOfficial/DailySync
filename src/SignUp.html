<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #ff6666;
        }
        .register-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            padding: 30px;
        }
        .illustration {
            background: url('your-image-path.png') no-repeat center;
            background-size: contain;
            height: 100%;
        }
        .form-control {
            margin-bottom: 15px;
        }
        body {
    background: url('https://drive.google.com/file/d/1TJINNQeU5s0lREy4SQo5rd1INXCj2EX5/view?usp=sharing') repeat;
    background-size: auto; 
}

    </style>
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="row w-75 register-container">
            <div class="col-md-6 d-flex align-items-center illustration">
                <img src="character.png" height="500px" width="5000px">
            </div>
            <div class="col-md-6">
                <h2 class="text-center">Sign Up</h2>
                <form>
                    <input type="text" class="form-control" placeholder="Enter First Name">
                    <input type="text" class="form-control" placeholder="Enter Last Name">
                    <input type="text" class="form-control" placeholder="Enter Username">
                    <input type="email" class="form-control" placeholder="Enter Email">
                    <input type="password" class="form-control" placeholder="Enter Password">
                    <input type="password" class="form-control" placeholder="Confirm Password">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="terms">
                        <label class="form-check-label" for="terms">I agree to all terms</label>
                    </div>
                    <button type="submit" class="btn btn-danger w-100 mt-3">Register</button>
                    <p class="text-center mt-2">Already have an account? <a href="Login.html">Sign in</a></p>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
