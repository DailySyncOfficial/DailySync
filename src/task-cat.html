        /* Customize the datepicker popup */
        .datepicker-dropdown {
            position: absolute !important;
            left: auto !important;
            right: 0 !important;
            /* Aligns with the right edge of the button */
            transform: translateX(-10px) translateY(5px);
            /* Fine-tune positioning */
        }


        /* Header of the datepicker (Month & Year) */
        .datepicker th {
            background: #ff5e5e;
            color: white;
            font-weight: bold;
            padding: 8px;
            border-radius: 12px 12px 0 0;
        }

        /* Days in the calendar */
        .datepicker td,
        .datepicker th {
            text-align: center;
            font-size: 14px;
            padding: 10px;
            border-radius: 8px;
        }

        /* Highlight today's date */
        .datepicker .today {
            background: #ff5e5e !important;
            color: white !important;
            font-weight: bold;
            border-radius: 8px;
        }

        /* Highlight selected date */
        .datepicker .active {
            background: #ff3b3b !important;
            color: white !important;
            font-weight: bold;
            border-radius: 8px;
        }

        /* Hover effect on calendar dates */
        .datepicker td:hover {
            background: rgba(255, 94, 94, 0.3);
            border-radius: 8px;
            cursor: pointer;
        }

        /* Make navigation arrows look better */
        .datepicker .prev,
        .datepicker .next {
            color: white !important;
            font-size: 18px;
            font-weight: bold;
        }

        /* Make the weekend dates stand out */
        .datepicker .dow:nth-child(7),
        .datepicker .dow:nth-child(1) {
            color: #ff3b3b;
            font-weight: bold;
        }

        .datepicker-wrapper {
            position: relative;
            display: inline-block;
        }

        #coinPopup {
    position: absolute;
    display: none;
    background: linear-gradient(135deg, #f8b500, #ff8000); /* Soft gradient */
    padding: 12px 18px;
    border-radius: 8px;
    color: #fff;
    font-weight: 600;
    font-size: 14px;
    text-align: center;
    box-shadow: 0px 6px 12px rgba(0, 0, 0, 0.15);
    transform: scale(0.95);
    transition: all 0.25s ease-in-out;
}

/* Smooth show effect */
#coinPopup.show {
    display: block;
    transform: scale(1);
    opacity: 1;
}

/* Popup arrow */
#coinPopup::before {
    content: "";
    position: absolute;
    top: -8px;
    left: 50%;
    transform: translateX(-50%);
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-bottom: 8px solid #ff8000; /* Same as gradient end */
    filter: drop-shadow(0px -2px 3px rgba(0, 0, 0, 0.1));
}

/* Coin Icon */
.coin-popup i {
    font-size: 30px;
    margin-bottom: 8px;
    color: #fff;
    animation: shine 1.5s infinite alternate;
}

/* Coin Shine Effect */
@keyframes shine {
    0% { text-shadow: 0 0 5px rgba(255, 223, 0, 0.5); }
    100% { text-shadow: 0 0 12px rgba(255, 223, 0, 1); }
}

    <!-- Task Entry Modal -->
    <div class="content text-center" style="margin-left: 250px; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh;">
        <div class="task-categories-container" style="max-width: 700px; width: 100%; background: white; padding: 20px; border-radius: 15px; box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1); text-align: center;">
            <h2 class="mb-4" style="color: #ff5e5e; font-weight: bold;">Task Categories</h2>
            <div class="task-categories" style="display: flex; flex-direction: column; gap: 15px; margin-top: 15px;">
                <div class="category-card" onclick="openTaskEntry('Education')" style="background: #ff5e5e; color: white; border-radius: 15px; padding: 15px 20px; box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1); text-align: center; font-weight: bold; cursor: pointer; transition: all 0.3s;">Education</div>
                <div class="category-card" onclick="openTaskEntry('Health')" style="background: #ff5e5e; color: white; border-radius: 15px; padding: 15px 20px; box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1); text-align: center; font-weight: bold; cursor: pointer; transition: all 0.3s;">Health</div>
                <div class="category-card" onclick="openTaskEntry('Work')" style="background: #ff5e5e; color: white; border-radius: 15px; padding: 15px 20px; box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1); text-align: center; font-weight: bold; cursor: pointer; transition: all 0.3s;">Work</div>
                <div class="category-card" onclick="openTaskEntry('Fitness')" style="background: #ff5e5e; color: white; border-radius: 15px; padding: 15px 20px; box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1); text-align: center; font-weight: bold; cursor: pointer; transition: all 0.3s;">Fitness</div>
            </div>
            <div class="task-list" id="task-list" style="margin-top: 20px; text-align: left;">
                <h3 style="color: #ff5e5e; font-weight: bold;">Task List</h3>
                <ul id="task-items" style="list-style-type: none; padding: 0;"></ul>
            </div>
        </div>
    </div>

    <div id="taskEntryModal" class="modal" style="display: none; position: fixed; z-index: 1; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.4);">
        <div class="modal-content" style="background-color: white; margin: 15% auto; padding: 20px; border-radius: 10px; width: 300px; text-align: center;">
            <h3 id="modalTitle" style="color: #ff5e5e; font-weight: bold;"></h3>
            <input type="text" id="taskInput" placeholder="Enter task..." style="width: 100%; padding: 10px; margin-top: 10px; border: 1px solid #ccc; border-radius: 5px;">
            <button class="btn btn-danger mt-2" onclick="addTask()">Add Task</button>
        </div>
    </div>

    <script>
        let currentCategory = "";

        function openTaskEntry(category) {
            currentCategory = category;
            document.getElementById("modalTitle").textContent = `Add Task for ${category}`;
            document.getElementById("taskEntryModal").style.display = "block";
        }

        function addTask() {
            let taskInput = document.getElementById("taskInput");
            let task = taskInput.value.trim();
            if (task) {
                let taskList = document.getElementById("task-items");
                let listItem = document.createElement("li");
                listItem.textContent = `${currentCategory}: ${task}`;
                listItem.style.background = "#f8d7da";
                listItem.style.padding = "10px";
                listItem.style.margin = "5px 0";
                listItem.style.borderRadius = "5px";
                taskList.appendChild(listItem);
                taskInput.value = "";
                closeModal();
            }
        }

        function closeModal() {
            document.getElementById("taskEntryModal").style.display = "none";
        }

        window.onclick = function(event) {
            let modal = document.getElementById("taskEntryModal");
            if (event.target == modal) {
                closeModal();
            }
        }
    </script>
