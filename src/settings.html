    <script>
        function updateDate() {
            const dateElement = document.getElementById("current-date");
            const dayElement = document.getElementById("current-day");

            const now = new Date();
            const options = { weekday: 'long' }; // Get full day name
            const formattedDay = new Intl.DateTimeFormat('en-US', options).format(now);
            const formattedDate = now.toLocaleDateString('en-GB'); // Format as DD/MM/YYYY

            dayElement.innerText = formattedDay;
            dateElement.innerText = formattedDate;
        }

        // Run function when page loads
        window.onload = updateDate;
    </script>
     <script>
        $(document).ready(function () {
            $('#hiddenDateInput').datepicker({
                format: "dd-mm-yyyy",
                autoclose: true,
                todayHighlight: true
            }).on('show', function () {
                $('.datepicker-dropdown').css({
                    position: 'absolute',
                    top: $("#dateIcon").offset().top + $("#dateIcon").outerHeight(),
                    left: $("#dateIcon").offset().left,
                    zIndex: 9999
                });
            });
        
            $("#dateIcon").click(function () {
                $('#hiddenDateInput').datepicker("show");
            });
        });
