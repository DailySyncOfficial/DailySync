<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Information</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background-color: #f0f2f5;
        }
        .container-box {
            background: white;
            border-radius: 10px;
            padding: 30px;
            max-width: 800px;
            margin: 50px auto;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .profile-image {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #ddd;
            display: inline-block;
        }
        .header-text {
            font-weight: bold;
            font-size: 24px;
            border-bottom: 2px solid #d9534f;
            display: inline-block;
        }
        .btn-custom {
            background-color: #d9534f;
            color: white;
            border: none;
        }
        .btn-custom:hover {
            background-color: #c9302c;
        }
        .go-back {
            float: right;
            text-decoration: none;
            font-weight: bold;
            color: black;
        }
        .navbar {
            background-color: #f7f7f7;
            padding: 10px;
            box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.1);
            position: fixed;
            width: 100%;
            /* Full width */
            top: 0;
            left: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo-space {
            display: flex;
            align-items: center;
            padding-left: 20px;
        }

        .logo-space img {
            height: 40px;
        }

        .search-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
        }

        .search-container input {
            width: 50%;
            max-width: 400px;
        }

        .nav-buttons {
            display: flex;
            align-items: center;
            gap: 15px;
            padding-right: 20px;
        }

        .nav-button {
            background: #ff5e5e;
            color: white;
            border: none;
            padding: 8px 10px;
            border-radius: 10px;
            cursor: pointer;
        }

        .nav-button:hover {
            background: #ff3b3b;
        }

        .date-info {
            text-align: right;
            font-size: 14px;
        }

        .dashboard-container {
            margin-top: 70px;
        }
        .sidebar {
            width: 250px;
            background-color: #ff6767;
            height: 100vh;
            position: fixed;
            padding-top: 20px;
            color: white;
        }

        .sidebar a {
            color: white;
            text-decoration: none;
            display: block;
            padding: 10px 20px;
        }

        .sidebar a:hover {
            background-color: #ff3b3b;
        }
        .profile-img {
            width: 100px;
            /* Adjust size as needed */
            height: 100px;
            /* Make width and height equal */
            border-radius: 50%;
            /* This makes it a perfect circle */
            object-fit: cover;
            /* Ensures the image fills the circle properly */
            border: 3px solid white;
            /* Optional: Adds a border around the image */
        }

    </style>
</head>
<body>
    <nav class="navbar navbar-light">
        <div class="logo-space">

            <span style="font-size: 22px; font-weight: bold; color: #ff5e5e;">Daily</span>
            <span style="font-size: 22px; font-weight: bold;">Sync</span>
        </div>
        <div class="search-container">
            <input class="form-control" type="search" placeholder="Search your task here..." aria-label="Search">
        </div>
        <div class="nav-buttons">
            <button class="nav-button">🔍</button>
            <button class="nav-button">📈</button>
            <button class="nav-button">📅</button>
            <button class="nav-button">❓</button>
            <div class="date-info">
                <strong id="current-day"></strong><br>
                <span id="current-date"></span>
            </div>

        </div>
    </nav>
    <br>
    <br><br>
    <div class="sidebar">
        <div class="text-center">
            <img src="images.jpg" alt="User Profile" class="profile-img">

            <h4>Asta</h4>
            <p>asta12@gmail.com</p>
        </div>
        <a href="Dashboard.html"><i class="fas fa-home"></i> Dashboard</a>
        <a href="task_list.html"><i class="fas fa-tasks"></i> My Task</a>
        <a href="#"><i class="fas fa-layer-group"></i> Task Categories</a>
        <a href="#"><i class="fas fa-coins"></i> Daily Coins</a>
        <a href="settings.html" >
            <i class="fas fa-cog"></i> Settings
        </a>


        <br><br>
        <br>
        <br><br><br><br><br>
        <a href="#"><i class="fas fa-sign-out-alt"></i> Logout</a>
    </div>

    
    <div class="container">
        <div class="container-box">
            <a href="Dashboard.html" class="go-back">Go Back</a>
            <h2 class="header-text">Account Information</h2>
            <div class="d-flex align-items-center mt-3">
                <div class="d-flex align-items-center mt-3">
                    <img src="images.jpg" alt="Profile Image" class="profile-image">
                    
                </div>
                
                <div class="ms-3">
                    <h4>Asta</h4>
                    <p>asta12@gmail.com</p>
                </div>
            </div>
            <form class="mt-4">
                <div class="mb-3">
                    <label class="form-label">First Name</label>
                    <input type="text" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Last Name</label>
                    <input type="text" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Contact Number</label>
                    <input type="text" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Position</label>
                    <input type="text" class="form-control">
                </div>
                <button type="submit" class="btn btn-custom">Update Info</button>
                <button type="button" class="btn btn-custom ms-2">Change Password</button>
            </form>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function updateDate() {
            const dateElement = document.getElementById("current-date");
            const dayElement = document.getElementById("current-day");

            const now = new Date();
            const options = { weekday: 'long' }; // Get full day name
            const formattedDay = new Intl.DateTimeFormat('en-US', options).format(now);
            const formattedDate = now.toLocaleDateString('en-GB'); // Format as DD/MM/YYYY

            dayElement.innerText = formattedDay;
            dateElement.innerText = formattedDate;
        }

        // Run function when page loads
        window.onload = updateDate;
    </script>
</body>
</html>
